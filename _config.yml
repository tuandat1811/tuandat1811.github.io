# ☕ Aerial's Corner — a late-night café blog
title: "Aerial's Corner"
tagline: A late-night café for stories
description: "Pull up a stool. It's raining outside, and Dat is brewing stories."
author:
  name: Tuan Dat
  email: dat.hdt181100@gmail.com
  facebook: https://www.facebook.com/shinya.Ft/
url: "https://tuandat1811.github.io"
baseurl: ""
lang: vi

timezone: Asia/Ho_Chi_Minh
permalink: /p/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# Content-Security-Policy for every page: only scripts from this site run, so HTML pasted into a
# story can't execute anything. The back room sets a stricter one in its own front matter.
csp: "script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

# Back room (hidden admin page at /backroom/)
admin:
  repo: tuandat1811/tuandat1811.github.io
  branch: main
