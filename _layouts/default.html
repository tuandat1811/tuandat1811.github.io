<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body class="{{ page.body_class | default: layout.body_class }}">
  <canvas class="rain" data-rain aria-hidden="true"></canvas>
  <a class="skip" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% unless page.noindex %}{% include record-player.html %}{% endunless %}
  <script src="{{ '/assets/js/cafe.js' | relative_url }}" defer></script>
  {% unless page.noindex %}<script src="{{ '/assets/js/record-player.js' | relative_url }}" defer></script>{% endunless %}
</body>
</html>
